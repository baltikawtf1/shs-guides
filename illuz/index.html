<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Иллюзия Славы — Интерактивный Гайд</title>
    <style>
        :root {
            --bg-color: #060713;
            --neon-cyan: #00f0ff;
            --neon-magenta: #ff007f;
            --neon-purple: #9d4edd;
            --text-main: #ffffff;
            --text-muted: #64748b;
            --glass-card: rgba(13, 16, 39, 0.6);
            --border-glass: rgba(255, 255, 255, 0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 100% 0%, rgba(157, 78, 221, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 0% 100%, rgba(0, 240, 255, 0.1) 0%, transparent 40%);
            color: var(--text-main);
            margin: 0;
            padding: 24px 16px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
        }

        /* Кнопка навигации назад */
        .navigation {
            margin-bottom: 24px;
        }

        .nav-btn {
            color: var(--neon-cyan);
            border: 1px solid rgba(0, 240, 255, 0.2);
            background: rgba(0, 240, 255, 0.03);
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-decoration: none;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.05);
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
        }

        .nav-btn:hover {
            color: #fff;
            background: var(--neon-cyan);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
            transform: translateY(-1px);
        }

        /* Заголовок истории */
        .page-header {
            margin-bottom: 24px;
        }

        .main-title {
            font-size: 28px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: linear-gradient(45deg, #fff, #9d4edd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }

        /* Единая объединенная карточка */
        .character-card {
            background: var(--glass-card);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 24px 20px;
            backdrop-filter: blur(16px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        /* Шапка персонажа внутри карточки */
        .favorit-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 28px;
            position: relative;
            z-index: 3;
        }

        /* Свечение вокруг фото персонажа */
        .favorit-avatar-mini {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: #090b14;
            border: 2px solid var(--neon-purple);
            box-shadow: 0 0 15px rgba(157, 78, 221, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 10px;
            overflow: hidden;
            flex-shrink: 0;
        }
        
        .favorit-avatar-mini img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .favorit-info-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--neon-magenta);
            font-weight: 700;
            margin: 0 0 2px 0;
        }

        .favorit-name {
            font-size: 20px;
            font-weight: 800;
            color: #fff;
            margin: 0;
        }

        /* Лента путей внутри карточки */
        .timeline-container {
            position: relative;
            padding-left: 36px;
        }

        /* Вертикальная неоновая линия начинается от фото */
        .timeline-container::before {
            content: "";
            position: absolute;
            left: 10px;
            top: -24px;
            bottom: 24px;
            width: 2px;
            background: linear-gradient(to bottom, var(--neon-purple), var(--neon-magenta), var(--neon-cyan));
            box-shadow: 0 0 10px rgba(157, 78, 221, 0.5);
            z-index: 1;
        }

        .timeline-item {
            position: relative;
            margin-bottom: 12px;
        }

        .timeline-item:last-child {
            margin-bottom: 0;
        }

        /* Пульсирующие неоновые точки на линии */
        .timeline-item::after {
            content: "";
            position: absolute;
            left: -30px;
            top: 20px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #0f1228;
            border: 2px solid var(--neon-magenta);
            box-shadow: 0 0 8px var(--neon-magenta);
            z-index: 2;
            transition: all 0.3s ease;
        }

        /* Чередование цветов точек */
        .timeline-item:nth-child(even)::after {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 8px var(--neon-cyan);
        }

        /* Кнопки-пути */
        .route-link {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 14px;
            padding: 14px 18px;
            font-size: 14px;
            font-weight: 500;
            color: #d1d5db;
            text-decoration: none;
            display: block;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-sizing: border-box;
        }

        /* Эффект наведения на вариант внутри карточки */
        .timeline-item:hover .route-link {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 0, 127, 0.3);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transform: translateX(4px);
        }

        .timeline-item:nth-child(even):hover .route-link {
            border-color: rgba(0, 240, 255, 0.3);
        }

        /* Анимация точек при наведении */
        .timeline-item:hover::after {
            transform: scale(1.4);
            background: #fff;
            box-shadow: 0 0 12px #fff;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Навигация -->
        <div class="navigation">
            <a href="../index.html" class="nav-btn">← К историям</a>
        </div>

        <!-- Заголовок истории -->
        <div class="page-header">
            <h1 class="main-title">Иллюзия Славы</h1>
        </div>

        <!-- Монолитная карточка персонажа -->
        <div class="character-card">
            
            <!-- Шапка персонажа внутри карточки -->
            <div class="favorit-header">
                <div class="favorit-avatar-mini">
                    <!-- <img src="shade.jpg" alt="Шейд"> -->
                    <span>ФОТО</span>
                </div>
                <div>
                    <p class="favorit-info-label">Сюжетная линия</p>
                    <p class="favorit-name">Шейд</p>
                </div>
            </div>

            <!-- Сокращенная лента путей -->
            <div class="timeline-container">
                <div class="timeline-item">
                    <a href="#" class="route-link">компромисс + чувства</a>
                </div>
                <div class="timeline-item">
                    <a href="#" class="route-link">компромисс + хладнокровие</a>
                </div>
                <div class="timeline-item">
                    <a href="#" class="route-link">провокация + чувства</a>
                </div>
                <div class="timeline-item">
                    <a href="#" class="route-link">провокация + хладнокровие</a>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
