<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Иллюзия Морвэйн</title>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 20px; line-height: 1.6; max-width: 450px; margin: 0 auto; background-color: #05020a; color: #ffffff;">

    <!-- Кнопка Назад как неоновый тег -->
    <a href="../index.html" style="text-decoration: none; color: #d1c4e9; font-size: 13px; font-weight: bold; background: #21133b; padding: 6px 14px; border-radius: 20px; border: 1px solid #7c4dff; display: inline-block; margin-bottom: 20px;">← ГЛАВНАЯ</a>

    <!-- Заголовок в стиле игровой витрины -->
    <div style="text-align: center; margin-bottom: 30px;">
        <h1 style="margin: 0; color: #ffffff; font-size: 34px; font-weight: 900; letter-spacing: 2px; text-shadow: 0 0 15px #bc00dd, 0 0 30px #7c4dff;">🔮 МОРВЭЙН</h1>
        <p style="color: #a192be; font-size: 13px; margin: 5px 0 0 0; text-transform: uppercase; letter-spacing: 1px;">Выбор ветки и баланса статов</p>
    </div>

    <!-- КАРТОЧКА КАЙДЕНА -->
    <div style="background-color: #0b0514; padding: 20px; border-radius: 16px; border: 1px solid #bc00dd; box-shadow: 0 0 20px rgba(188, 0, 221, 0.2); margin-bottom: 25px;">
        <div style="display: flex; align-items: center; margin-bottom: 20px; border-bottom: 1px solid rgba(188, 0, 221, 0.15); padding-bottom: 10px;">
            <span style="background: #2e7d32; width: 8px; height: 24px; display: inline-block; border-radius: 4px; margin-right: 10px; box-shadow: 0 0 8px #2e7d32;"></span>
            <h2 style="margin: 0; color: #ffffff; font-size: 24px; font-weight: 800;">Кайден</h2>
        </div>
        
        <!-- КНОПКА 1: Такт + Высокая совесть -->
        <a href="./kayden/tact-high.html" style="display: flex; align-items: stretch; background: #160d24; text-decoration: none; border-radius: 10px; margin-bottom: 12px; border: 1px solid #2e7d32; box-shadow: 0 4px 10px rgba(0,0,0,0.3); overflow: hidden;">
            <div style="background: #2e7d32; display: flex; align-items: center; justify-content: center; width: 45px; font-size: 18px; box-shadow: 0 0 10px rgba(46,125,50,0.5);">🕊️</div>
            <div style="flex: 1; padding: 14px; color: #ffffff; font-size: 14px; font-weight: bold; text-align: left; background: linear-gradient(90deg, #1d1030, #160d24);">+ Такт / Высокая совесть</div>
        </a>

        <!-- КНОПКА 2: Такт + Спящая совесть -->
        <a href="./kayden/tact-low.html" style="display: flex; align-items: stretch; background: #160d24; text-decoration: none; border-radius: 10px; margin-bottom: 20px; border: 1px solid #1b5e20; box-shadow: 0 4px 10px rgba(0,0,0,0.3); overflow: hidden;">
            <div style="background: #1b5e20; display: flex; align-items: center; justify-content: center; width: 45px; font-size: 18px;">🥀</div>
            <div style="flex: 1; padding: 14px; color: #a5d6a7; font-size: 14px; font-weight: bold; text-align: left; background: linear-gradient(90deg, #1d1030, #160d24);">— Такт / Спящая совесть</div>
        </a>
        
        <!-- КНОПКА 3: Непреклонность + Высокая совесть -->
        <a href="./kayden/flex-high.html" style="display: flex; align-items: stretch; background: #160d24; text-decoration: none; border-radius: 10px; margin-bottom: 12px; border: 1px solid #455a64; box-shadow: 0 4px 10px rgba(0,0,0,0.3); overflow: hidden;">
            <div style="background: #455a64; display: flex; align-items: center; justify-content: center; width: 45px; font-size: 18px; box-shadow: 0 0 10px rgba(69,90,100,0.5);">🛡️</div>
            <div style="flex: 1; padding: 14px; color: #ffffff; font-size: 14px; font-weight: bold; text-align: left; background: linear-gradient(90deg, #1d1030, #160d24);">— Непреклонность / Высокая совесть</div>
        </a>

        <!-- КНОПКА 4: Непреклонность + Спящая совесть -->
        <a href="./kayden/flex-low.html" style="display: flex; align-items: stretch; background: #160d24; text-decoration: none; border-radius: 10px; border: 1px solid #263238; box-shadow: 0 4px 10px rgba(0,0,0,0.3); overflow: hidden;">
            <div style="background: #263238; display: flex; align-items: center; justify-content: center; width: 45px; font-size: 18px;">🔥</div>
            <div style="flex: 1; padding: 14px; color: #b0bec5; font-size: 14px; font-weight: bold; text-align: left; background: linear-gradient(90deg, #1d1030, #160d24);">+ Непреклонность / Спящая совесть</div>
        </a>
    </div>

    <!-- КАРТОЧКА ФАНТОМА -->
    <div style="background-color: #0b0514; padding: 20px; border-radius: 16px; border: 1px solid rgba(188, 0, 221, 0.4); margin-bottom: 25px;">
        <div style="display: flex; align-items: center; margin-bottom: 10px;">
            <span style="background: #c62828; width: 8px; height: 24px; display: inline-block; border-radius: 4px; margin-right: 10px; box-shadow: 0 0 8px #c62828;"></span>
            <h2 style="margin: 0; color: #ffffff; font-size: 24px; font-weight: 800; opacity: 0.8;">Фантом</h2>
        </div>
        <p style="color: #b39ddb; font-size: 14px; font-style: italic; opacity: 0.5; text-align: center; margin: 15px 0;">Гайды наполняются...</p>
    </div>

    <!-- КАРТОЧКА АЙЗЕКА -->
    <div style="background-color: #0b0514; padding: 20px; border-radius: 16px; border: 1px solid rgba(188, 0, 221, 0.4); margin-bottom: 25px;">
        <div style="display: flex; align-items: center; margin-bottom: 10px;">
            <span style="background: #1565c0; width: 8px; height: 24px; display: inline-block; border-radius: 4px; margin-right: 10px; box-shadow: 0 0 8px #1565c0;"></span>
            <h2 style="margin: 0; color: #ffffff; font-size: 24px; font-weight: 800; opacity: 0.8;">Айзек</h2>
        </div>
        <p style="color: #b39ddb; font-size: 14px; font-style: italic; opacity: 0.5; text-align: center; margin: 15px 0;">Гайды наполняются...</p>
    </div>

</body>
</html>
