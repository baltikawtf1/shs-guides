<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Иллюзия Морвэйн</title>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 20px; line-height: 1.6; max-width: 450px; margin: 0 auto; background-color: #05020a; color: #ffffff;">

    <!-- Кнопка Назад как неоновый тег -->
    <a href="../index.html" style="text-decoration: none; color: #d1c4e9; font-size: 13px; font-weight: bold; background: #21133b; padding: 6px 14px; border-radius: 20px; border: 1px solid #7c4dff; display: inline-block; margin-bottom: 20px;">← ГЛАВНАЯ</a>

    <!-- Заголовок в стиле игровой витрины -->
    <div style="text-align: center; margin-bottom: 30px;">
        <h1 style="margin: 0; color: #ffffff; font-size: 34px; font-weight: 900; letter-spacing: 2px; text-shadow: 0 0 15px #bc00dd, 0 0 30px #7c4dff;">МОРВЭЙН</h1>
        <p style="color: #a192be; font-size: 13px; margin: 5px 0 0 0; text-transform: uppercase; letter-spacing: 1px;">Выбор ветки и баланса статов</p>
    </div>

    <!-- КАРТОЧКА КАЙДЕНА -->
    <div style="background-color: #0b0514; padding: 20px; border-radius: 16px; border: 1px solid #bc00dd; box-shadow: 0 0 20px rgba(188, 0, 221, 0.2); margin-bottom: 25px;">
        <div style="display: flex; align-items: center; margin-bottom: 20px; border-bottom: 1px solid rgba(188, 0, 221, 0.15); padding-bottom: 10px;">
            <span style="background: #2e7d32; width: 8px; height: 24px; display: inline-block; border-radius: 4px; margin-right: 10px; box-shadow: 0 0 8px #2e7d32;"></span>
            <h2 style="margin: 0; color: #ffffff; font-size: 24px; font-weight: 800;">Кайден</h2>
        </div>
        
        <!-- КНОПКА 1: Такт + Высокая совесть (Яркий зеленый неон) -->
        <a href="./kayden/tact-high.html" style="display: block; background: linear-gradient(135deg, rgba(76,175,80,0.15), rgba(46,125,50,0.3)); color: #a5d6a7; text-decoration: none; padding: 15px; border-radius: 12px; margin-bottom: 12px; font-size: 15px; font-weight: bold; text-align: center; border: 1px solid #4caf50; box-shadow: 0 0 10px rgba(76,175,80,0.15), inset 0 1px 0 rgba(255,255,255,0.1);">
            + Такт / Высокая совесть
        </a>

        <!-- КНОПКА 2: Такт + Спящая совесть (Изумрудный неон) -->
        <a href="./kayden/tact-low.html" style="display: block; background: linear-gradient(135deg, rgba(38,166,154,0.15), rgba(0,121,107,0.3)); color: #80cbc4; text-decoration: none; padding: 15px; border-radius: 12px; margin-bottom: 20px; font-size: 15px; font-weight: bold; text-align: center; border: 1px solid #26a69a; box-shadow: 0 0 10px rgba(38,166,154,0.15), inset 0 1px 0 rgba(255,255,255,0.1);">
            — Такт / Спящая совесть
        </a>
        
        <!-- КНОПКА 3: Непреклонность + Высокая совесть (Стальной синий неон) -->
        <a href="./kayden/flex-high.html" style="display: block; background: linear-gradient(135deg, rgba(33,150,243,0.15), rgba(21,101,192,0.3)); color: #90caf9; text-decoration: none; padding: 15px; border-radius: 12px; margin-bottom: 12px; font-size: 15px; font-weight: bold; text-align: center; border: 1px solid #2196f3; box-shadow: 0 0 10px rgba(33,150,243,0.15), inset 0 1px 0 rgba(255,255,255,0.1);">
            — Непреклонность / Высокая совесть
        </a>

        <!-- КНОПКА 4: Непреклонность + Спящая совесть (Фиолетово-огненный неон) -->
        <a href="./kayden/flex-low.html" style="display: block; background: linear-gradient(135deg, rgba(156,39,176,0.15), rgba(106,27,154,0.3)); color: #e1bee7; text-decoration: none; padding: 15px; border-radius: 12px; font-size: 15px; font-weight: bold; text-align: center; border: 1px solid #9c27b0; box-shadow: 0 0 10px rgba(156,39,176,0.15), inset 0 1px 0 rgba(255,255,255,0.1);">
            + Непреклонность / Спящая совесть
        </a>
    </div>

    <!-- КАРТОЧКА ФАНТОМА -->
    <div style="background-color: #0b0514; padding: 20px; border-radius: 16px; border: 1px solid rgba(188, 0, 221, 0.4); margin-bottom: 25px;">
        <div style="display: flex; align-items: center; margin-bottom: 10px;">
            <span style="background: #c62828; width: 8px; height: 24px; display: inline-block; border-radius: 4px; margin-right: 10px; box-shadow: 0 0 8px #c62828;"></span>
            <h2 style="margin: 0; color: #ffffff; font-size: 24px; font-weight: 800; opacity: 0.8;">Фантом</h2>
        </div>
        <p style="color: #b39ddb; font-size: 14px; font-style: italic; opacity: 0.5; text-align: center; margin: 15px 0;">Гайды наполняются...</p>
    </div>

    <!-- КАРТОЧКА АЙЗЕКА -->
    <div style="background-color: #0b0514; padding: 20px; border-radius: 16px; border: 1px solid rgba(188, 0, 221, 0.4); margin-bottom: 25px;">
        <div style="display: flex; align-items: center; margin-bottom: 10px;">
            <span style="background: #1565c0; width: 8px; height: 24px; display: inline-block; border-radius: 4px; margin-right: 10px; box-shadow: 0 0 8px #1565c0;"></span>
            <h2 style="margin: 0; color: #ffffff; font-size: 24px; font-weight: 800; opacity: 0.8;">Айзек</h2>
        </div>
        <p style="color: #b39ddb; font-size: 14px; font-style: italic; opacity: 0.5; text-align: center; margin: 15px 0;">Гайды наполняются...</p>
    </div>

</body>
</html>
