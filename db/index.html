<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фавориты истории Дитя Бездны — Гайды</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --c-imperial: #2A123F;
            --c-amethyst: #4B1F6F;
            --c-lavender: #9C86B9;
            --c-orchid: #C686DD;
            --c-pearl: #F1EDF7;
            --bg-deep: #12071d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(75, 31, 111, 0.3) 0%, transparent 60%),
                radial-gradient(circle at 90% 90%, rgba(42, 18, 63, 0.5) 0%, transparent 50%);
            color: var(--c-pearl);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1050px;
            margin: 0 auto;
        }

        /* Навигация */
        .nav-header {
            display: flex;
            justify-content: flex-start;
            margin-bottom: 25px;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(42, 18, 63, 0.6);
            color: var(--c-orchid);
            padding: 8px 18px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            border: 1px solid rgba(156, 134, 185, 0.2);
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }

        .btn-back:hover {
            background: var(--c-amethyst);
            color: var(--c-pearl);
            border-color: var(--c-orchid);
            transform: translateX(-3px);
        }

        /* Шапка страницы */
        .title-section {
            text-align: center;
            margin-bottom: 25px;
        }

        .main-heading {
            font-family: 'Cinzel', serif;
            font-size: clamp(2rem, 3.5vw, 2.8rem);
            font-weight: 600;
            letter-spacing: 2px;
            color: var(--c-pearl);
            text-transform: uppercase;
        }

        /* Компактная информационная табличка */
        .notice-plate {
            background: rgba(42, 18, 63, 0.45);
            border: 1px solid rgba(156, 134, 185, 0.18);
            border-left: 3px solid var(--c-orchid);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 16px 24px;
            margin-bottom: 40px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .notice-plate p {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #dcd0ec;
            text-align: center;
            font-weight: 300;
        }

        /* Сетка персонажей */
        .characters-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        @media (max-width: 900px) {
            .characters-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .characters-grid {
                grid-template-columns: 1fr;
            }
        }

        .char-card {
            background: linear-gradient(145deg, var(--c-imperial), #1a0b26);
            border: 1px solid rgba(156, 134, 185, 0.15);
            border-radius: 16px;
            overflow: hidden;
            text-decoration: none;
            color: var(--c-pearl);
            display: flex;
            flex-direction: column;
            position: relative;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .char-image-container {
            height: 280px;
            position: relative;
            background: linear-gradient(to bottom, #391854, #180824);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Декоративная рамка внутри фото-зоны */
        .char-image-container::before {
            content: '';
            position: absolute;
            inset: 10px;
            border: 1px solid rgba(156, 134, 185, 0.15);
            border-radius: 10px;
            z-index: 1;
            pointer-events: none;
        }

        .char-monogram {
            font-family: 'Cinzel', serif;
            font-size: 4.5rem;
            font-weight: 700;
            color: rgba(156, 134, 185, 0.12);
            transition: all 0.5s ease;
            z-index: 0;
        }

        .char-card:hover .char-monogram {
            transform: scale(1.08);
            color: rgba(198, 134, 221, 0.22);
        }

        /* Нижняя часть карточки */
        .char-details {
            padding: 18px 20px;
            background: rgba(42, 18, 63, 0.9);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid rgba(156, 134, 185, 0.1);
        }

        .char-name {
            font-family: 'Cinzel', serif;
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--c-pearl);
        }

        .char-arrow {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(156, 134, 185, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(156, 134, 185, 0.2);
            transition: all 0.3s ease;
        }

        .char-arrow svg {
            width: 12px;
            height: 12px;
            fill: var(--c-lavender);
            transition: transform 0.3s ease;
        }

        /* Эффекты при наведении на карточку */
        .char-card:hover {
            transform: translateY(-6px);
            border-color: var(--c-orchid);
            box-shadow: 0 15px 35px rgba(42, 18, 63, 0.5);
        }

        .char-card:hover .char-arrow {
            background: var(--c-orchid);
            border-color: var(--c-orchid);
        }

        .char-card:hover .char-arrow svg {
            fill: var(--c-imperial);
            transform: translateX(2px);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Кнопка «К историям» -->
        <div class="nav-header">
            <a href="#" class="btn-back">
                <span>←</span> К историям
            </a>
        </div>

        <!-- Надпись сверху -->
        <div class="title-section">
            <h1 class="main-heading">Фавориты истории Дитя Бездны</h1>
        </div>

        <!-- Аккуратная и компактная табличка с текстом -->
        <div class="notice-plate">
            <p>Ниже предоставлены гайды для каждого фаворита истории. Они не были разделены по статам, потому что мы не можем угадать вашу комбинацию, но все прописаны внутри серий. Искренне надеемся, что читателям будет удобно!</p>
        </div>

        <!-- Анкеты персонажей -->
        <div class="characters-grid">
            <!-- Савьер -->
            <a href="#" class="char-card">
                <div class="char-image-container">
                    <span class="char-monogram">С</span>
                </div>
                <div class="char-details">
                    <span class="char-name">Савьер</span>
                    <div class="char-arrow">
                        <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                    </div>
                </div>
            </a>

            <!-- Фелан -->
            <a href="#" class="char-card">
                <div class="char-image-container">
                    <span class="char-monogram">Ф</span>
                </div>
                <div class="char-details">
                    <span class="char-name">Фелан</span>
                    <div class="char-arrow">
                        <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                    </div>
                </div>
            </a>

            <!-- Данте -->
            <a href="#" class="char-card">
                <div class="char-image-container">
                    <span class="char-monogram">Д</span>
                </div>
                <div class="char-details">
                    <span class="char-name">Данте</span>
                    <div class="char-arrow">
                        <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                    </div>
                </div>
            </a>

            <!-- Хантер -->
            <a href="#" class="char-card">
                <div class="char-image-container">
                    <span class="char-monogram">Х</span>
                </div>
                <div class="char-details">
                    <span class="char-name">Хантер</span>
                    <div class="char-arrow">
                        <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                    </div>
                </div>
            </a>
        </div>
    </div>

</body>
</html>
