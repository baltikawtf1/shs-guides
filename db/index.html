<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фавориты истории Дитя Бездны — Гайды</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --c-imperial: #2A123F;
            --c-amethyst: #4B1F6F;
            --c-lavender: #9C86B9;
            --c-orchid: #C686DD;
            --c-pearl: #F1EDF7;
            --bg-deep: #100519;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-deep);
            /* Художественный фоновый градиент с атмосферным свечением */
            background-image: 
                radial-gradient(circle at 20% 15%, rgba(75, 31, 111, 0.45) 0%, transparent 55%),
                radial-gradient(circle at 80% 85%, rgba(42, 18, 63, 0.7) 0%, transparent 60%),
                radial-gradient(circle at 50% 50%, rgba(26, 8, 41, 0.9) 0%, transparent 100%);
            color: var(--c-pearl);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            padding: 50px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Тонкий декоративный элемент по центру для глубины */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 50% 30%, rgba(198, 134, 221, 0.05) 0%, transparent 60%);
            pointer-events: none;
        }

        .wrapper {
            max-width: 1100px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        /* Кнопка «К историям» */
        .nav-wrap {
            margin-bottom: 35px;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: rgba(42, 18, 63, 0.4);
            color: var(--c-pearl);
            padding: 10px 22px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            border: 1px solid rgba(156, 134, 185, 0.25);
            backdrop-filter: blur(12px);
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .back-button svg {
            width: 16px;
            height: 16px;
            fill: var(--c-orchid);
            transition: transform 0.3s ease;
        }

        .back-button:hover {
            background: rgba(75, 31, 111, 0.7);
            border-color: var(--c-orchid);
            transform: translateX(-5px);
            box-shadow: 0 6px 25px rgba(75, 31, 111, 0.5);
        }

        .back-button:hover svg {
            transform: translateX(-3px);
        }

        /* Заголовок */
        .header-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .main-title {
            font-family: 'Cinzel', serif;
            font-size: clamp(2.2rem, 4vw, 3.4rem);
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--c-pearl);
            text-transform: uppercase;
            text-shadow: 0 4px 25px rgba(75, 31, 111, 0.6);
        }

        /* Компактная, но изысканная информационная табличка */
        .compact-notice {
            background: linear-gradient(135deg, rgba(42, 18, 63, 0.5) 0%, rgba(20, 5, 33, 0.7) 100%);
            border: 1px solid rgba(156, 134, 185, 0.2);
            border-left: 3px solid var(--c-orchid);
            backdrop-filter: blur(15px);
            border-radius: 14px;
            padding: 18px 28px;
            margin: 0 auto 50px auto;
            max-width: 820px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        .compact-notice p {
            font-size: 0.98rem;
            line-height: 1.6;
            color: #d6cae6;
            text-align: center;
            font-weight: 300;
        }

        /* Сетка карточек персонажей */
        .characters-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
        }

        @media (max-width: 950px) {
            .characters-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 550px) {
            .characters-container {
                grid-template-columns: 1fr;
            }
        }

        .char-card {
            background: linear-gradient(145deg, rgba(42, 18, 63, 0.7), rgba(22, 9, 34, 0.9));
            border: 1px solid rgba(156, 134, 185, 0.2);
            border-radius: 20px;
            overflow: hidden;
            text-decoration: none;
            color: var(--c-pearl);
            display: flex;
            flex-direction: column;
            position: relative;
            transition: all 0.5s cubic-bezier(0.165, 0.84, 0.44, 1);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.4);
        }

        .char-img-area {
            height: 310px;
            position: relative;
            background: linear-gradient(180deg, #381555 0%, #170724 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Внутренняя тонкая элегантная рамка */
        .char-img-area::after {
            content: '';
            position: absolute;
            inset: 12px;
            border: 1px solid rgba(156, 134, 185, 0.12);
            border-radius: 12px;
            pointer-events: none;
            transition: border-color 0.4s ease;
        }

        .char-monogram {
            font-family: 'Cinzel', serif;
            font-size: 5rem;
            font-weight: 700;
            color: rgba(156, 134, 185, 0.1);
            transition: all 0.5s ease;
        }

        /* Информация под картинкой */
        .char-info-box {
            padding: 22px;
            background: rgba(42, 18, 63, 0.85);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid rgba(156, 134, 185, 0.15);
            backdrop-filter: blur(10px);
        }

        .char-title-name {
            font-family: 'Cinzel', serif;
            font-size: 1.35rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--c-pearl);
        }

        .char-action-circle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(156, 134, 185, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(156, 134, 185, 0.2);
            transition: all 0.4s ease;
        }

        .char-action-circle svg {
            width: 14px;
            height: 14px;
            fill: var(--c-lavender);
            transition: transform 0.4s ease, fill 0.4s ease;
        }

        /* Премиальный ховер-эффект */
        .char-card:hover {
            transform: translateY(-10px);
            border-color: var(--c-orchid);
            box-shadow: 0 20px 45px rgba(75, 31, 111, 0.5);
        }

        .char-card:hover .char-img-area::after {
            border-color: rgba(198, 134, 221, 0.35);
        }

        .char-card:hover .char-monogram {
            transform: scale(1.12);
            color: rgba(198, 134, 221, 0.22);
            text-shadow: 0 0 20px rgba(198, 134, 221, 0.2);
        }

        .char-card:hover .char-action-circle {
            background: var(--c-orchid);
            border-color: var(--c-orchid);
            box-shadow: 0 0 15px rgba(198, 134, 221, 0.4);
        }

        .char-card:hover .char-action-circle svg {
            fill: var(--c-imperial);
            transform: translateX(3px);
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <!-- Кнопка «К историям» -->
        <div class="nav-wrap">
            <a href="#" class="back-button">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                К историям
            </a>
        </div>

        <!-- Надпись сверху -->
        <div class="header-section">
            <h1 class="main-title">Фавориты истории Дитя Бездны</h1>
        </div>

        <!-- Компактная табличка с текстом -->
        <div class="compact-notice">
            <p>Ниже предоставлены гайды для каждого фаворита истории. Они не были разделены по статам, потому что мы не можем угадать вашу комбинацию, но все прописаны внутри серий. Искренне надеемся, что читателям будет удобно!</p>
        </div>

        <!-- Анкеты персонажей (Савьер, Фелан, Данте, Хантер) -->
        <div class="characters-container">
            <!-- Савьер -->
            <a href="#" class="char-card">
                <div class="char-img-area">
                    <span class="char-monogram">С</span>
                </div>
                <div class="char-info-box">
                    <span class="char-title-name">Савьер</span>
                    <div class="char-action-circle">
                        <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                    </div>
                </div>
            </a>

            <!-- Фелан -->
            <a href="#" class="char-card">
                <div class="char-img-area">
                    <span class="char-monogram">Ф</span>
                </div>
                <div class="char-info-box">
                    <span class="char-title-name">Фелан</span>
                    <div class="char-action-circle">
                        <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                    </div>
                </div>
            </a>

            <!-- Данте -->
            <a href="#" class="char-card">
                <div class="char-img-area">
                    <span class="char-monogram">Д</span>
                </div>
                <div class="char-info-box">
                    <span class="char-title-name">Данте</span>
                    <div class="char-action-circle">
                        <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                    </div>
                </div>
            </a>

            <!-- Хантер -->
            <a href="#" class="char-card">
                <div class="char-img-area">
                    <span class="char-monogram">Х</span>
                </div>
                <div class="char-info-box">
                    <span class="char-title-name">Хантер</span>
                    <div class="char-action-circle">
                        <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                    </div>
                </div>
            </a>
        </div>
    </div>

</body>
</html>
